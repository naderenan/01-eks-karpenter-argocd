# Karpenter scale-out demo.
#   kubectl apply -f k8s/inflate.yaml
#   kubectl scale deployment inflate --replicas=10
#   kubectl get nodeclaims -w        # watch Karpenter launch Spot nodes in ~60s
#   kubectl scale deployment inflate --replicas=0   # watch consolidation remove them
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate
spec:
  replicas: 0
  selector:
    matchLabels:
      app: inflate
  template:
    metadata:
      labels:
        app: inflate
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        karpenter.sh/nodepool: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: inflate
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.7
          resources:
            requests:
              cpu: "1"
              memory: 1.5Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
